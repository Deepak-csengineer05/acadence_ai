version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: acadence_postgres
    restart: always
    environment:
      POSTGRES_DB: acadence_db
      POSTGRES_USER: acadence_user
      POSTGRES_PASSWORD: acadence_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acadence_user -d acadence_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: acadence_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acadence_backend
    restart: always
    environment:
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:-production_super_secret_key_acadence_ai_2026}
      DATABASE_URL: postgresql://acadence_user:acadence_secure_password_2026@postgres:5432/acadence_db
      QDRANT_URL: http://qdrant:6333
      CORS_ORIGINS: http://localhost,http://localhost:80,http://127.0.0.1
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: acadence_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
