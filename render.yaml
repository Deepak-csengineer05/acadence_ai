services:
  - type: web
    name: acadence-ai-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker --chdir backend app.main:app
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: acadence-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: acadence-db
    plan: free
